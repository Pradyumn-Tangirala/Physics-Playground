# main: lint, test, build, run the end-to-end tests against that exact build
# artifact, then deploy it to GitHub Pages using the official Pages actions
# (no gh-pages branch, no manual deploys).
#
# One-time repository setting: Settings → Pages → Build and deployment →
# Source: "GitHub Actions".
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time; a newer push waits rather than racing an older one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Lint, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4 # checks out exactly ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci # installs exactly what package-lock.json records
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  e2e:
    name: End-to-end (Chromium) on the artifact being deployed
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Test the bytes that will be published, not a second build of the same commit.
      - uses: actions/download-artifact@v4
        with:
          name: github-pages
          path: pages-artifact
      - name: Unpack the Pages artifact into dist/
        run: mkdir -p dist && tar -xf pages-artifact/artifact.tar -C dist
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --project=chromium
        env:
          E2E_PREBUILT: '1'

  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: [build, e2e]
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4 # deploys the artifact built from this commit in the build job
