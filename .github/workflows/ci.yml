# Pull requests (and pushes to branches other than main): lint, unit/UI tests
# with coverage, production build, and end-to-end tests in several browsers.
name: CI

on:
  pull_request:
  push:
    branches-ignore: [main] # main is verified (and deployed) by deploy.yml

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run test:coverage
      - run: npm run build
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: coverage
          path: coverage/
          retention-days: 14

  e2e:
    name: End-to-end (${{ matrix.project }})
    runs-on: ubuntu-latest
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - { project: chromium, browser: chromium }
          - { project: firefox, browser: firefox }
          - { project: edge, browser: msedge }
          - { project: mobile, browser: chromium }
          - { project: tablet, browser: chromium }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - run: npx playwright test --project=${{ matrix.project }}
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report-${{ matrix.project }}
          path: playwright-report/
          retention-days: 14

  performance:
    name: Performance and leak checks
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # Only the performance project (it would otherwise pull in its dependency project).
      - run: npx playwright test --project=performance --no-deps
      # Before/after kernel speed-ups depend on the CPU (the FDTD step is 1.5× faster on the
      # development machine but measured 0.73× on this runner), so they are recorded, not gated.
      # The frame-time and memory-leak checks above do gate.
      - run: npm run test:perf
        continue-on-error: true
      - name: Upload measurements
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: performance
          path: test-results/perf-*.json
          retention-days: 30
